<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Luana Descomplica.IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #8b9dc3 0%, #a8c5a8 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #8b9dc3;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b9dc3;
            box-shadow: 0 0 0 3px rgba(139, 157, 195, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8b9dc3 0%, #b8a8c5 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .login-button:hover {
            transform: scale(1.02);
        }

        .admin-container {
            display: none;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .admin-header h1 {
            color: #8b9dc3;
        }

        .logout-button {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-card h3 {
            color: #8b9dc3;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .table-header h2 {
            color: #8b9dc3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f9f9f9;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #8b9dc3;
            border-bottom: 2px solid #eee;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.pendente {
            background: #fff3cd;
            color: #856404;
        }

        .status.aprovado {
            background: #d4edda;
            color: #155724;
        }

        .status.rejeitado {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-view {
            background: #8b9dc3;
            color: white;
        }

        .btn-approve {
            background: #28a745;
            color: white;
        }

        .btn-reject {
            background: #dc3545;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #8b9dc3;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }

        .close:hover {
            color: #333;
        }

        .detail-row {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #8b9dc3;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #333;
            word-break: break-word;
        }

        .error {
            color: #dc3545;
            padding: 15px;
            background: #f8d7da;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success {
            color: #155724;
            padding: 15px;
            background: #d4edda;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8b9dc3;
        }

        .export-button {
            padding: 10px 20px;
            background: #8b9dc3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🔐 Painel Admin</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Digite a senha">
                </div>
                <button type="submit" class="login-button">Acessar</button>
            </form>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <h1>📊 Candidaturas - Oferta Piloto</h1>
            <div>
                <button class="export-button" onclick="exportarCSV()">📥 Exportar CSV</button>
                <button class="logout-button" onclick="logout()">Sair</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total</h3>
                <div class="number" id="totalCandidaturas">0</div>
            </div>
            <div class="stat-card">
                <h3>Pendentes</h3>
                <div class="number" id="pendentes">0</div>
            </div>
            <div class="stat-card">
                <h3>Aprovados</h3>
                <div class="number" id="aprovados">0</div>
            </div>
            <div class="stat-card">
                <h3>Rejeitados</h3>
                <div class="number" id="rejeitados">0</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Todas as Candidaturas</h2>
            </div>
            <div id="emptyMessage" class="empty-message" style="display: none;">Nenhuma candidatura recebida ainda</div>
            <table id="candidaturasTable" style="display: none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Empresa</th>
                        <th>Solução</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="candidaturasBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Detalhes -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detalhes da Candidatura</h2>
                <span class="close" onclick="fecharModal()">&times;</span>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        const SENHA_CORRETA = 'Luan@IA2025';
        let senhaAtual = null;
        let candidaturasData = [];

        // Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const senha = document.getElementById('senha').value;
            
            if (senha === SENHA_CORRETA) {
                senhaAtual = senha;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                carregarCandidaturas();
            } else {
                document.getElementById('loginError').innerHTML = '<div class="error">❌ Senha incorreta</div>';
            }
        });

        function carregarCandidaturas() {
            try {
                const stored = localStorage.getItem('candidaturas_piloto');
                candidaturasData = stored ? JSON.parse(stored) : [];
                
                // Atualizar stats
                document.getElementById('totalCandidaturas').textContent = candidaturasData.length;
                document.getElementById('pendentes').textContent = candidaturasData.filter(c => c.status === 'pendente').length;
                document.getElementById('aprovados').textContent = candidaturasData.filter(c => c.status === 'aprovado').length;
                document.getElementById('rejeitados').textContent = candidaturasData.filter(c => c.status === 'rejeitado').length;
                
                // Renderizar tabela
                const tbody = document.getElementById('candidaturasBody');
                tbody.innerHTML = '';
                
                if (candidaturasData.length === 0) {
                    document.getElementById('emptyMessage').style.display = 'block';
                    document.getElementById('candidaturasTable').style.display = 'none';
                    return;
                }
                
                document.getElementById('emptyMessage').style.display = 'none';
                document.getElementById('candidaturasTable').style.display = 'table';
                
                candidaturasData.forEach(candidatura => {
                    const row = document.createElement('tr');
                    const data_formatada = new Date(candidatura.criado_em).toLocaleDateString('pt-BR');
                    
                    row.innerHTML = `
                        <td>#${candidatura.id}</td>
                        <td>${candidatura.nome_completo}</td>
                        <td>${candidatura.email_profissional}</td>
                        <td>${candidatura.nome_empresa}</td>
                        <td>${candidatura.solucao}</td>
                        <td><span class="status ${candidatura.status}">${candidatura.status}</span></td>
                        <td>${data_formatada}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-view" onclick="verDetalhes(${candidatura.id})">Ver</button>
                                <button class="btn-approve" onclick="atualizarStatus(${candidatura.id}, 'aprovado')">✓</button>
                                <button class="btn-reject" onclick="atualizarStatus(${candidatura.id}, 'rejeitado')">✗</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        function verDetalhes(id) {
            const candidatura = candidaturasData.find(c => c.id === id);
            if (!candidatura) return;
            
            const html = `
                <div class="detail-row">
                    <div class="detail-label">Nome Completo</div>
                    <div class="detail-value">${candidatura.nome_completo}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Email</div>
                    <div class="detail-value">${candidatura.email_profissional}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">WhatsApp</div>
                    <div class="detail-value">${candidatura.whatsapp}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Empresa</div>
                    <div class="detail-value">${candidatura.nome_empresa}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Cidade/Estado</div>
                    <div class="detail-value">${candidatura.cidade_estado}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Área de Atuação</div>
                    <div class="detail-value">${candidatura.area_atuacao}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Número de Funcionários</div>
                    <div class="detail-value">${candidatura.num_funcionarios}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Solução Desejada</div>
                    <div class="detail-value">${candidatura.solucao}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Problema a Resolver</div>
                    <div class="detail-value">${candidatura.problema}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Materiais</div>
                    <div class="detail-value">${candidatura.materiais || 'Nenhum'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Pessoas Envolvidas</div>
                    <div class="detail-value">${candidatura.num_pessoas}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Feedback</div>
                    <div class="detail-value">${candidatura.feedback}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Comentários</div>
                    <div class="detail-value">${candidatura.comentarios || 'Nenhum'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Data de Candidatura</div>
                    <div class="detail-value">${new Date(candidatura.criado_em).toLocaleDateString('pt-BR')} às ${new Date(candidatura.criado_em).toLocaleTimeString('pt-BR')}</div>
                </div>
            `;
            
            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('detailModal').style.display = 'block';
        }

        function fecharModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function atualizarStatus(id, novoStatus) {
            try {
                const candidatura = candidaturasData.find(c => c.id === id);
                if (candidatura) {
                    candidatura.status = novoStatus;
                    localStorage.setItem('candidaturas_piloto', JSON.stringify(candidaturasData));
                    carregarCandidaturas();
                    fecharModal();
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        function logout() {
            senhaAtual = null;
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('adminContainer').style.display = 'none';
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').innerHTML = '';
        }

        function exportarCSV() {
            let csv = 'ID,Nome,Email,Empresa,Solução,Status,Data\n';
            
            candidaturasData.forEach(c => {
                const data = new Date(c.criado_em).toLocaleDateString('pt-BR');
                csv += `${c.id},"${c.nome_completo}","${c.email_profissional}","${c.nome_empresa}","${c.solucao}","${c.status}","${data}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `candidaturas_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
